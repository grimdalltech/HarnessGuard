[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessguard"
version = "0.1.0"
description = "Zero-cost, offline static analysis for AI-agent orchestration harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Grimdall Technologies"}]
keywords = ["ai-agents", "security", "static-analysis", "multi-agent", "sast"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/grimdalltech/HarnessGuard"
Repository = "https://github.com/grimdalltech/HarnessGuard"
Issues = "https://github.com/grimdalltech/HarnessGuard/issues"

[project.scripts]
harnessguard = "harnessguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
